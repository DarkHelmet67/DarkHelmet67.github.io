<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$pagetitle$ · Luca Ceccatelli</title>
<meta name="description" content="$description$">
<meta property="og:title" content="$pagetitle$">
<meta property="og:type" content="article">
<style>
:root{--bg:#0f1115;--panel:#171a21;--text:#e6e8ee;--muted:#9aa3b2;--accent:#ff5a36;--border:#2a2f3a;--code:#11141a}
@media (prefers-color-scheme:light){:root{--bg:#fafafa;--panel:#fff;--text:#1c1f26;--muted:#5b6473;--border:#e2e5ea;--code:#f3f4f6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top,footer{max-width:960px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}
header.top a,footer a{color:var(--muted);text-decoration:none}
header.top a:hover,footer a:hover{color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:0 20px 48px}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin:24px 0 16px}
h2{margin-top:2.4em;padding-top:.6em;border-top:1px solid var(--border)}
h1,h2,h3{scroll-margin-top:16px}
a{color:var(--accent)}
blockquote{margin:16px 0;padding:12px 16px;background:var(--panel);border-left:3px solid var(--accent);border-radius:6px;color:var(--muted)}
blockquote p{margin:.3em 0}
.table-wrap,table{display:block;overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
:not(pre)>code{background:var(--code);padding:.1em .35em;border-radius:4px;border:1px solid var(--border)}
pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.45}
hr{border:0;border-top:1px solid var(--border);margin:32px 0}
$highlighting-css$
</style>
</head>
<body>
<header class="top"><a href="./">← Luca Ceccatelli</a><a href="claude-cheatsheet.md">Versione Markdown</a></header>
<main>
$body$
</main>
<footer><span>© 2026 by Luca Ceccatelli</span><span>Generato automaticamente da Markdown</span></footer>
</body>
</html>
